[package]
name = "lint-owl"
version = "0.1.0"
edition = "2021"
description = "A static analyzer whose result is the data-flow path from an untrusted source to a dangerous sink"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
